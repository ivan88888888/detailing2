<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#17181B">
  <title>CRM · Detailing Family IF</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>tailwind.config = { theme: { extend: { colors: { accent: '#FF5500', canvas: '#17181B', card: '#2E3035', ink: '#F4F1EA', mist: '#E3E4E6' }, fontFamily: { sans: ['Montserrat', 'system-ui', 'sans-serif'] } } } }</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #121316
    }

.login {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem calc(2rem + env(safe-area-inset-bottom));
      background: #1a1b1e;
    }

.login-hero {
      position: relative;
      height: 17vh;
      height: 17dvh;
      min-height: 110px;
      background: #121316
    }

.login-sheet {
      flex: 1;
      margin-top: -1px;
      padding: 1.75rem 1.5rem calc(2rem + env(safe-area-inset-bottom));
      background: #1a1b1e;
      border: 0;
      border-radius: 18px 18px 0 0;
    }

.login-form {
      width: 100%;
      max-width: 22rem;
      margin: 0 auto;
      display: grid;
      gap: .75rem;
    }

    .lg-title {
      margin: 0 0 .5rem;
      font-size: 1.5rem;
      font-weight: 800;
      color: #F4F1EA
    }

    .lg-title span {
      color: #ff5500
    }

    .lg-in {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid rgba(244, 241, 234, .2);
      background: #17181b;
      border-radius: .75rem;
      padding: .85rem 1rem;
      font: inherit;
      font-size: 1rem;
      color: #F4F1EA
    }

    .lg-in::placeholder {
      color: rgba(227, 228, 230, .4)
    }

    .lg-in:focus {
      outline: none;
      border-color: #ff5500
    }

    .lg-btn {
      border: 0;
      border-radius: .75rem;
      background: #ff5500;
      color: #17181b;
      font: inherit;
      font-weight: 700;
      padding: .9rem 1rem;
      cursor: pointer
    }

    .lg-msg {
      min-height: 1.25rem;
      margin: 0;
      font-size: .875rem;
      color: rgba(227, 228, 230, .7)
    }

    /* Головне меню: скляна панель зі світінням над нею */
    .app-nav {
      display: flex;
      align-items: stretch;
      justify-content: flex-start;
      gap: 2px;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-left: 6px;
      padding-right: 6px;
      -webkit-mask-image: linear-gradient(to right, transparent 0, #000 10px, #000 calc(100% - 10px), transparent 100%);
      mask-image: linear-gradient(to right, transparent 0, #000 10px, #000 calc(100% - 10px), transparent 100%);
      background: rgba(23, 24, 27, .82);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(244, 241, 234, .14)
    }

    .app-nav::-webkit-scrollbar {
      display: none
    }

    .app-nav::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 100%;
      height: 28px;
      pointer-events: none;
      background: linear-gradient(to top, rgba(255, 85, 0, .16), transparent)
    }

    .app-nav button {
      position: relative;
      flex: 0 0 auto;
      white-space: nowrap;
      padding: 1rem .75rem;
      font-size: .75rem;
      line-height: 1.2
    }

    @media (min-width: 640px) {
      .app-nav {
        justify-content: center;
        gap: 6px;
        -webkit-mask-image: none;
        mask-image: none
      }

      .app-nav button {
        padding: 1rem 1.15rem
      }
    }

    .app-nav .is-active::after {
      content: "";
      position: absolute;
      left: 20%;
      right: 20%;
      top: -1px;
      height: 2px;
      border-radius: 2px;
      background: #ff5500;
      box-shadow: 0 0 12px 2px rgba(255, 85, 0, .65)
    }
  </style>
</head>

<body class="bg-canvas font-sans text-ink antialiased">
  <div id="app"></div>
  <script>
    /* ===== Налаштування: Supabase -> Project Settings -> API ===== */
    const SUPABASE_URL = 'https://blsbjolbrznefwxscavk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_NxMkhhDCZw-ZGZawJkQAWA_-j1t3WJj';

    const WORKER_URL = 'https://detailing-lead.detailing-family-if.workers.dev';
    const SITE_URL = 'https://detailing.family.ivano-frankivsk.ua';
    const sb = supabase.createClient(SUPABASE_URL || 'http://localhost', SUPABASE_ANON_KEY || 'x');
    const app = document.getElementById('app');
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = d => d ? new Date(d).toLocaleString('uk-UA', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
    const ST = { new: 'Нова', in_progress: 'У роботі', booked: 'Записаний', client: 'Став клієнтом', lost: 'Не підійшло' };
    const INP = 'w-full rounded-xl border border-ink/20 bg-canvas px-4 py-3 text-base placeholder:text-mist/40 focus:border-accent focus:outline-none';
    const BTN = 'rounded-xl bg-accent px-5 py-3 font-bold text-canvas';
    const BTN2 = 'rounded-xl border border-ink/25 px-5 py-3 font-semibold';
    let tab = 'today', filter = 'new', me = null, staff = [], q = '';

    const links = (c, m) => [c.phone || (m === 'phone' && c.contact) ? `<a class="${BTN2} text-sm" href="tel:${esc(c.phone || c.contact)}">Подзвонити</a>` : '',
    (c.telegram || (m === 'telegram' && c.contact)) ? `<a class="${BTN2} text-sm" target="_blank" rel="noopener" href="https://t.me/${esc((c.telegram || c.contact).replace(/^@/, ''))}">Telegram</a>` : '',
    (c.viber || (m === 'viber' && c.contact)) ? `<a class="${BTN2} text-sm" href="viber://chat?number=${encodeURIComponent(c.viber || c.contact)}">Viber</a>` : '',
    (c.phone || (m === 'phone' && c.contact)) ? `<a class="${BTN2} text-sm" target="_blank" rel="noopener" href="https://wa.me/${esc((c.phone || c.contact).replace(/\D/g, ''))}">WhatsApp</a>` : ''].join('');

    /* ===== Вхід ===== */
    function login(msg = '') {
      app.innerHTML = `<div class="login"><div class="login-hero" aria-hidden="true"></div><div class="login-sheet"><form id="lf" class="login-form"><h1 class="lg-title">CRM Detailing Family <span>IF</span></h1>
  <input class="lg-in" name="email" type="email" autocomplete="username" required placeholder="Email">
  <input class="lg-in" name="password" type="password" autocomplete="current-password" required placeholder="Пароль">
  <button class="lg-btn">Увійти</button><p class="lg-msg" role="alert">${esc(msg)}</p></form></div></div>`;
      $('lf').onsubmit = async e => {
        e.preventDefault(); const f = e.target;
        const { error } = await sb.auth.signInWithPassword({ email: f.email.value, password: f.password.value });
        error ? login('Невірний email або пароль.') : start();
      };
    }
    const $ = id => document.getElementById(id);
    async function start() {
      const { data: { user } } = await sb.auth.getUser(); if (!user) return login();
      const { data } = await sb.from('staff').select('*');
      if (!data || !data.length) { await sb.auth.signOut(); return login('Для цього акаунта немає доступу.'); }
      me = user; staff = data; render();
    }

    /* ===== Каркас ===== */
    function render() {
      const prevNav = document.querySelector('.app-nav');
      const navScrollLeft = prevNav ? prevNav.scrollLeft : 0;

      app.innerHTML = `<main class="mx-auto max-w-3xl px-4 pb-28 pt-4"><div class="mb-2 flex justify-end gap-4 text-xs text-mist/60"><button id="ly">Бонуси</button><button id="an">Аналітика</button><button id="sk">Склад</button><button id="pr">Прайс</button><button id="out">Вийти</button></div><div id="view"></div></main>
  <nav class="app-nav fixed inset-x-0 bottom-0 z-20" style="padding-bottom:env(safe-area-inset-bottom)">
  ${[['today', 'Сьогодні'], ['leads', 'Ліди'], ['chat', 'Мультичат'], ['clients', 'Клієнти'], ['cal', 'Календар'], ['orders', 'Замовлення']].map(([k, l]) => `<button data-tab="${k}" class="font-semibold ${tab === k ? 'is-active text-accent' : 'text-mist/70'}">${l}</button>`).join('')}</nav>`;

      const nextNav = document.querySelector('.app-nav');
      if (nextNav && navScrollLeft) nextNav.scrollLeft = navScrollLeft;

      document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
      $('pr').onclick = () => { tab = 'price'; render(); };
      $('sk').onclick = () => { tab = 'stock'; render(); };
      $('an').onclick = () => { tab = 'stats'; render(); };
      $('ly').onclick = () => { tab = 'loyalty'; render(); };
      unreadBadge();
      $('out').onclick = async () => { await sb.auth.signOut(); login(); };
      ({ today: viewToday, leads: viewLeads, chat: viewChat, clients: viewClients, cal: viewCal, orders: viewOrders, price: viewPrice, stock: viewStock, stats: viewStats, loyalty: viewLoyalty })[tab]();
    }
    function modal(html) {
      closeModal(); const d = document.createElement('div'); d.id = 'mod';
      d.className = 'fixed inset-0 z-30 overflow-y-auto bg-black/70 p-3';
      d.innerHTML = `<div class="mx-auto my-4 max-w-xl rounded-2xl bg-card p-5">${html}</div>`;
      d.addEventListener('click', e => { if (e.target === d) closeModal(); }); document.body.appendChild(d); return d;
    }
    const closeModal = () => { const m = $('mod'); if (m) m.remove(); };
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    /* ===== Ліди ===== */
    async function viewLeads() {
      $('view').innerHTML = `<h1 class="text-2xl font-extrabold">Ліди</h1><div class="my-4 flex flex-wrap gap-2">${['new', 'in_progress', 'booked', 'client', 'lost', 'all'].map(k => `<button data-f="${k}" class="rounded-full border px-4 py-2 text-sm ${filter === k ? 'border-accent bg-accent font-bold text-canvas' : 'border-card text-mist/80'}">${ST[k] || 'Усі'}</button>`).join('')}</div><div id="list" class="space-y-2"></div>`;
      document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; viewLeads(); });
      let r = sb.from('leads').select('*').order('created_at', { ascending: false }).limit(200); if (filter !== 'all') r = r.eq('status', filter);
      const { data, error } = await r; if (error) return $('list').textContent = 'Помилка завантаження: ' + error.message;
      $('list').innerHTML = data.length ? data.map(l => `<button data-lead="${l.id}" class="block w-full rounded-2xl bg-card p-4 text-left"><div class="flex justify-between gap-3"><b>${esc(l.name)}</b><span class="text-xs text-mist/60">${fmt(l.created_at)}</span></div>
    <div class="mt-1 text-sm text-mist/80">${esc(l.contact)} · ${esc(l.service_interest || '')}</div><div class="mt-2 text-xs ${l.status === 'new' ? 'font-bold text-accent' : 'text-mist/60'}">${ST[l.status]}${l.next_contact_at ? ' · наступний контакт ' + esc(l.next_contact_at) : ''}</div></button>`).join('') : '<p class="text-mist/60">Заявок немає.</p>';
      document.querySelectorAll('[data-lead]').forEach(b => b.onclick = () => openLead(data.find(x => x.id === b.dataset.lead)));
    }
    function openLead(l) {
      const m = modal(`<div class="flex justify-between"><h2 class="text-xl font-bold">${esc(l.name)}</h2><button id="x" class="text-2xl leading-none text-mist/60" aria-label="Закрити">&times;</button></div>
  <p class="mt-1 text-sm text-mist/80">${esc(l.contact_method)}: ${esc(l.contact)} · ${fmt(l.created_at)}</p><div class="mt-3 flex flex-wrap gap-2">${links({ contact: l.contact }, l.contact_method)}</div>
  <dl class="mt-4 space-y-1 text-sm">${[['Послуга', l.service_interest], ['Авто', [l.car, l.car_class].filter(Boolean).join(', ')], ['Зручний час', l.preferred_time], ['Побажання', l.comment], ['Джерело', [l.utm_source, l.utm_medium, l.utm_campaign].filter(Boolean).join(' / ') || 'пряме'], ['Згода на пропозиції', l.consent_marketing ? 'так' : 'ні']].map(([k, v]) => v ? `<div><dt class="inline text-mist/60">${k}: </dt><dd class="inline">${esc(v)}</dd></div>` : '').join('')}</dl>
  <div class="mt-5 grid gap-3"><select id="st" class="${INP}">${Object.entries(ST).map(([k, v]) => `<option value="${k}" ${l.status === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
  <input id="lr" class="${INP}" placeholder="Причина відмови (якщо не підійшло)" value="${esc(l.lost_reason)}"><label class="text-sm text-mist/70">Наступний контакт<input id="nc" type="date" class="${INP} mt-1" value="${esc(l.next_contact_at)}"></label>
  <select id="as" class="${INP}"><option value="">Відповідальний: не призначено</option>${staff.map(s => `<option value="${s.user_id}" ${l.assignee === s.user_id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>
  <button id="sv" class="${BTN}">Зберегти</button>${l.client_id ? '' : `<button id="mk" class="${BTN2}">Створити клієнта із заявки</button>`}<p id="msg" class="text-sm text-mist/70"></p></div>`);
      $('x').onclick = closeModal;
      $('sv').onclick = async () => {
        const st = $('st').value, up = { status: st, lost_reason: $('lr').value || null, next_contact_at: $('nc').value || null, assignee: $('as').value || null };
        if (l.status === 'new' && st !== 'new' && !l.first_response_at) up.first_response_at = new Date().toISOString();
        const { error } = await sb.from('leads').update(up).eq('id', l.id);
        if (error) return $('msg').textContent = 'Помилка: ' + error.message;
        if (st !== l.status) await sb.from('timeline').insert({ lead_id: l.id, client_id: l.client_id, kind: 'status', text: `Статус: ${ST[st]}`, created_by: me.id });
        closeModal(); render();
      };
      if ($('mk')) $('mk').onclick = async () => {
        $('mk').disabled = true; const ph = l.contact_method === 'phone' ? l.contact : null;
        let c = null; if (ph) c = (await sb.from('clients').select('*').eq('phone', ph).maybeSingle()).data;
        if (!c) {
          const r = await sb.from('clients').insert({
            name: l.name, phone: ph, telegram: l.contact_method === 'telegram' ? l.contact : null, viber: l.contact_method === 'viber' ? l.contact : null,
            source: l.utm_source || 'direct', utm_source: l.utm_source, utm_medium: l.utm_medium, utm_campaign: l.utm_campaign, consent_processing: !!l.consent_processing, consent_processing_at: l.created_at,
            consent_marketing: !!l.consent_marketing, consent_marketing_at: l.consent_marketing ? l.created_at : null, consent_version: l.consent_version
          }).select().single();
          if (r.error) { $('mk').disabled = false; return $('msg').textContent = 'Помилка: ' + r.error.message; } c = r.data;
          if (l.car) await sb.from('cars').insert({ client_id: c.id, model: l.car, car_class: l.car_class || null });
        }
        await sb.from('leads').update({ status: 'client', client_id: c.id }).eq('id', l.id);
        await sb.from('timeline').insert({ client_id: c.id, lead_id: l.id, kind: 'status', text: 'Клієнта створено із заявки', created_by: me.id });
        closeModal(); openClient(c.id);
      };
    }

    /* ===== Клієнти ===== */
    async function viewClients() {
      $('view').innerHTML = `<div class="flex items-center justify-between"><h1 class="text-2xl font-extrabold">Клієнти</h1><button id="nc" class="${BTN} px-4 py-2 text-sm">+ Клієнт</button></div>
  <input id="q" type="search" placeholder="Ім'я, телефон або номер авто" value="${esc(q)}" class="${INP} my-4"><div id="list" class="space-y-2"></div>`;
      $('nc').onclick = newClient; let t; $('q').oninput = e => { q = e.target.value.trim(); clearTimeout(t); t = setTimeout(load, 250); }; load();
      async function load() {
        let ids = []; if (q) { const c = await sb.from('cars').select('client_id').ilike('plate', `%${q}%`).limit(20); ids = (c.data || []).map(x => x.client_id); }
        let r = sb.from('clients').select('*').order('created_at', { ascending: false }).limit(100);
        if (q) { const s = q.replace(/[,()%]/g, ' '); r = r.or(`name.ilike.%${s}%,phone.ilike.%${s}%,telegram.ilike.%${s}%${ids.length ? `,id.in.(${ids.join(',')})` : ''}`); }
        const { data, error } = await r; if (error) return $('list').textContent = 'Помилка: ' + error.message;
        $('list').innerHTML = data.length ? data.map(c => `<button data-c="${c.id}" class="block w-full rounded-2xl bg-card p-4 text-left"><b>${esc(c.name)}</b><div class="text-sm text-mist/80">${esc(c.phone || c.telegram || c.viber || '')}</div></button>`).join('') : '<p class="text-mist/60">Нікого не знайдено.</p>';
        document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => openClient(b.dataset.c));
      }
    }
    function newClient() {
      modal(`<h2 class="mb-3 text-xl font-bold">Новий клієнт</h2><form id="nf" class="grid gap-3"><input name="name" required placeholder="Ім'я" class="${INP}"><input name="phone" type="tel" placeholder="Телефон +380…" class="${INP}">
  <label class="flex gap-3 text-sm text-mist/80"><input name="cp" type="checkbox" class="mt-0.5 h-5 w-5 accent-accent">Клієнт дав згоду на обробку даних</label><button class="${BTN}">Зберегти</button><p id="msg" class="text-sm"></p></form>`);
      $('nf').onsubmit = async e => {
        e.preventDefault(); const f = e.target, d = f.phone.value.replace(/\D/g, ''); const ph = d.length === 10 && d[0] === '0' ? '+38' + d : d.length === 12 && d.startsWith('380') ? '+' + d : null;
        if (f.phone.value && !ph) return $('msg').textContent = 'Телефон: формат +380XXXXXXXXX або 0XXXXXXXXX.';
        const { data, error } = await sb.from('clients').insert({ name: f.name.value.trim(), phone: ph, source: 'вручну', consent_processing: f.cp.checked, consent_processing_at: f.cp.checked ? new Date().toISOString() : null }).select().single();
        if (error) return $('msg').textContent = error.code === '23505' ? 'Клієнт із таким телефоном уже є.' : 'Помилка: ' + error.message; closeModal(); openClient(data.id);
      };
    }
    async function openClient(id) {
      const [c, cars, tl] = await Promise.all([sb.from('clients').select('*').eq('id', id).single(), sb.from('cars').select('*').eq('client_id', id), sb.from('timeline').select('*').eq('client_id', id).order('created_at', { ascending: false }).limit(50)]);
      if (c.error) return; const k = c.data;
      const m = modal(`<div class="flex justify-between"><h2 class="text-xl font-bold">${esc(k.name)}</h2><button id="x" class="text-2xl leading-none text-mist/60" aria-label="Закрити">&times;</button></div>
  <p class="mt-1 text-sm text-mist/80">${esc([k.phone, k.telegram, k.viber, k.email].filter(Boolean).join(' · '))}</p><div class="mt-3 flex flex-wrap gap-2">${links(k, '')}</div>
  <p class="mt-3 text-xs text-mist/60">Згода на обробку: ${k.consent_processing ? 'так' : 'ні'} · на пропозиції: ${k.consent_marketing ? 'так' : 'ні'}${k.source ? ' · джерело: ' + esc(k.source) : ''}</p>
  <button id="no2" class="${BTN2} mt-4 w-full">Нове замовлення</button><button id="bn" class="${BTN2} mt-2 w-full">Бонуси та рекомендації</button><h3 class="mt-5 font-bold">Авто</h3><div class="mt-2 space-y-1 text-sm">${cars.data.length ? cars.data.map(a => `<div>${esc([a.brand, a.model, a.car_class, a.color, a.plate].filter(Boolean).join(' · '))}</div>`).join('') : '<span class="text-mist/60">Немає</span>'}</div>
  <form id="cf" class="mt-3 grid grid-cols-2 gap-2"><input name="model" required placeholder="Марка і модель" class="${INP} col-span-2"><select name="cls" class="${INP}"><option value="">Клас</option><option>Седан</option><option>Кросовер</option><option>Позашляховик</option></select><input name="plate" placeholder="Номер" class="${INP}"><button class="${BTN2} col-span-2">Додати авто</button></form>
  <h3 class="mt-5 font-bold">Історія</h3><form id="nf2" class="mt-2 flex gap-2"><input name="t" required placeholder="Нотатка" class="${INP}"><button class="${BTN} px-4">+</button></form>
  <div class="mt-3 space-y-2 text-sm">${tl.data.map(e => `<div class="border-l-2 border-accent pl-3"><span class="text-xs text-mist/60">${fmt(e.created_at)}</span><br>${esc(e.text)}</div>`).join('') || '<span class="text-mist/60">Поки порожньо</span>'}</div>`);
      $('x').onclick = closeModal;
      $('no2').onclick = () => { closeModal(); newOrder(id); };
      $('bn').onclick = () => { closeModal(); openBonus(id); };
      $('cf').onsubmit = async e => { e.preventDefault(); const f = e.target; await sb.from('cars').insert({ client_id: id, model: f.model.value.trim(), car_class: f.cls.value || null, plate: f.plate.value.trim() || null }); openClient(id); };
      $('nf2').onsubmit = async e => { e.preventDefault(); await sb.from('timeline').insert({ client_id: id, kind: 'note', text: e.target.t.value.trim(), created_by: me.id }); openClient(id); };
    }

    /* ===== Прайс ===== */
    let services = [];

    function bonusBalance(moves, at = Date.now()) {

        const t = +new Date(m.created_at), a = +m.amount_uah;

        await sb.from('bonus_moves').insert({ client_id: id, kind: 'adjust', amount_uah: a, note: e.target.n.value.trim(), created_by: me.id }); openBonus(id);
      };
      const fill = async () => { const s = $('rs').value.trim().replace(/[,()%]/g, ' '); let r = sb.from('clients').select('id,name,phone').neq('id', id).order('created_at', { ascending: false }).limit(15); if (s) r = r.or(`name.ilike.%${s}%,phone.ilike.%${s}%`); const { data } = await r; $('rl').innerHTML = (data || []).map(x => `<option value="${x.id}">${esc(x.name)} ${esc(x.phone || '')}</option>`).join(''); };
      let t; $('rs').oninput = () => { clearTimeout(t); t = setTimeout(fill, 250); }; fill();
      $('rsv').onclick = async () => { if (!$('rl').value) return; await sb.from('clients').update({ referred_by: $('rl').value }).eq('id', id); openBonus(id); };
    }
    /* Кешбек, списання бонусів і винагороди за рекомендацію при видачі замовлення */
    async function loyaltyOnDelivered(od, up, total) {
      if (!LS) await loadLoyalty(); const used = +up.bonus_used_uah || 0, paid = Math.max(0, total - used), mv = [];
      const exp = LS.bonus_valid_days ? iso(new Date(Date.now() + LS.bonus_valid_days * 864e5)) : null;
      if (used > 0) mv.push({ client_id: od.client_id, kind: 'redeem', amount_uah: -used, order_id: od.id, note: 'Оплата бонусами' });
      const cb = Math.round(paid * (+LS.cashback_percent || 0) / 100); if (cb > 0) mv.push({ client_id: od.client_id, kind: 'cashback', amount_uah: cb, order_id: od.id, expires_at: exp, note: `Кешбек ${LS.cashback_percent}%` });
      const { data: c } = await sb.from('clients').select('referred_by').eq('id', od.client_id).single();
      if (c && c.referred_by && paid >= (+LS.referral_min_order_uah || 0) && (+LS.referral_referrer_uah > 0 || +LS.referral_referred_uah > 0)) {
        const [prev, cnt] = await Promise.all([sb.from('orders').select('id').eq('client_id', od.client_id).eq('status', 'delivered').neq('id', od.id).limit(1), sb.from('bonus_moves').select('id', { count: 'exact', head: true }).eq('client_id', c.referred_by).eq('kind', 'referral')]);
        if (!(prev.data || []).length && (!LS.referral_max_per_referrer || (cnt.count || 0) < LS.referral_max_per_referrer)) {
          if (+LS.referral_referrer_uah > 0) mv.push({ client_id: c.referred_by, kind: 'referral', amount_uah: +LS.referral_referrer_uah, order_id: od.id, expires_at: exp, note: 'Бонус за рекомендацію' });
          if (+LS.referral_referred_uah > 0) mv.push({ client_id: od.client_id, kind: 'referral', amount_uah: +LS.referral_referred_uah, order_id: od.id, expires_at: exp, note: 'Бонус за першу покупку за рекомендацією' });
        }
      }
      if (mv.length) await sb.from('bonus_moves').insert(mv.map(x => ({ ...x, created_by: me.id })));
      await sb.from('orders').update({ bonus_accrued_uah: cb }).eq('id', od.id);
    }

    /* ===== Мультичат (єдина переписка) ===== */
    const CH = { telegram: 'Telegram', viber: 'Viber', whatsapp: 'WhatsApp', instagram: 'Instagram' };
    async function unreadBadge() {
      const { data } = await sb.from('conversations').select('unread').gt('unread', 0), n = (data || []).reduce((a, x) => a + x.unread, 0), b = document.querySelector('[data-tab=chat]');
      if (b && n) b.insertAdjacentHTML('beforeend', `<span class="absolute right-1 top-1.5 rounded-full bg-accent px-1.5 text-[10px] font-bold leading-4 text-canvas">${n}</span>`);
    }
    async function viewChat() {
        $('view').innerHTML = `<h1 class="text-2xl font-extrabold">Мультичат</h1><p class="mt-1 text-xs text-mist/60">Підключені Telegram та Instagram. Viber і WhatsApp додамо пізніше.</p><div id="list" class="mt-4 space-y-2"></div>`;
        const { data, error } = await sb.from('conversations').select('*').order('last_message_at', { ascending: false }).limit(100);
        if (error) return $('list').textContent = 'Помилка: ' + error.message + ' (чи виконано inbox.sql?)';
        $('list').innerHTML = data.length ? data.map(c => `<button data-cv="${c.id}" class="block w-full rounded-2xl bg-card p-4 text-left"><div class="flex justify-between gap-3"><b>${esc(c.display_name || c.username || c.external_id)}</b><span class="text-xs text-mist/60">${fmt(c.last_message_at)}</span></div>
    <div class="mt-1 flex items-center justify-between gap-3 text-sm text-mist/80"><span class="truncate">${esc(c.last_text)}</span>${c.unread ? `<span class="inline-flex h-5 min-w-[1.25rem] shrink-0 items-center justify-center rounded-full bg-accent px-1.5 text-xs font-bold leading-none text-canvas">${c.unread}</span>` : ''}</div>
    <div class="mt-1 text-xs text-mist/50">${CH[c.channel]}${c.client_id ? '' : ' · не прив\'язано до клієнта'}</div></button>`).join('') : '<p class="text-mist/60">Розмов ще немає. Вони з\'являться, коли клієнт напише на ваш Telegram після підключення бота.</p>';
        document.querySelectorAll('[data-cv]').forEach(b => b.onclick = () => openChat(data.find(x => x.id === b.dataset.cv)));
      }
    async function openChat(c) {
      modal(`<div class="flex items-start justify-between gap-3"><div><h2 class="text-xl font-bold">${esc(c.display_name || c.username || c.external_id)}</h2><p class="text-xs text-mist/60">${CH[c.channel]}${c.username ? ' · @' + esc(c.username) : ''}</p></div><button id="x" class="text-2xl leading-none text-mist/60" aria-label="Закрити">&times;</button></div>
  <div class="mt-3 flex flex-wrap gap-2">${c.client_id ? '<button id="oc" class="' + BTN2 + ' px-3 py-2 text-sm">Картка клієнта</button>' : '<button id="lk" class="' + BTN2 + ' px-3 py-2 text-sm">Прив\'язати до клієнта</button><button id="mk" class="' + BTN2 + ' px-3 py-2 text-sm">Створити клієнта</button>'}</div>
  <div id="thr" class="mt-3 max-h-[45vh] space-y-2 overflow-y-auto rounded-xl bg-canvas p-3 text-sm"></div>
  <form id="sf2" class="mt-3 flex gap-2"><textarea name="t" rows="2" required placeholder="Повідомлення…" class="${INP}"></textarea><button class="${BTN} px-4">Надіслати</button></form><p id="win" class="mt-1 text-xs text-mist/60"></p><p id="msg" class="mt-2 text-sm text-mist/80"></p>`);
      $('x').onclick = closeModal;
      const load = async () => {
        if (!$('thr')) return; const { data } = await sb.from('messages').select('*').eq('conversation_id', c.id).order('created_at').limit(200), box = $('thr'), end = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
        box.innerHTML = (data || []).map(m => `<div class="flex ${m.direction === 'out' ? 'justify-end' : ''}"><div class="max-w-[85%] rounded-2xl px-3 py-2 ${m.direction === 'out' ? 'bg-accent text-canvas' : 'bg-card'}"><div class="whitespace-pre-wrap break-words">${esc(m.text)}</div><div class="mt-1 text-[10px] opacity-60">${fmt(m.created_at)}</div></div></div>`).join('') || '<span class="text-mist/60">Повідомлень немає</span>';
        if (c.channel === 'instagram') { const li = (data || []).filter(m => m.direction === 'in').pop(), left = li ? 864e5 - (Date.now() - new Date(li.created_at)) : 0; $('win').textContent = left > 0 ? `Відповісти в Instagram можна ще ${Math.floor(left / 36e5)} год ${Math.floor(left % 36e5 / 6e4)} хв` : 'Минуло понад 24 години від останнього повідомлення клієнта: Instagram не дозволяє відповісти з CRM. Відповідайте в застосунку Instagram.'; $('sf2').querySelector('button').disabled = left <= 0; }
        if (end) box.scrollTop = box.scrollHeight; await sb.from('conversations').update({ unread: 0 }).eq('id', c.id).gt('unread', 0);
      };
      await load(); $('thr').scrollTop = $('thr').scrollHeight; const timer = setInterval(() => { $('thr') ? load() : clearInterval(timer); }, 10000);
      $('sf2').onsubmit = async e => {
        e.preventDefault(); const f = e.target, text = f.t.value.trim(); if (!text) return; $('msg').textContent = 'Надсилаємо…';
        try {
          const tok = (await sb.auth.getSession()).data.session.access_token;
          const r = await fetch(WORKER_URL + '/chat-send', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok }, body: JSON.stringify({ conversation_id: c.id, text }) });
          if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
          f.t.value = ''; $('msg').textContent = ''; load();
        } catch (err) { $('msg').textContent = 'Не вдалося надіслати: ' + (err.message === 'window_closed' ? 'минуло понад 24 години, Instagram не дозволяє відповісти з CRM' : err.message) + (WORKER_URL ? '' : ' (вкажіть WORKER_URL у файлі CRM)'); }
      };
      if ($('oc')) $('oc').onclick = () => { closeModal(); openClient(c.client_id); };
      if ($('mk')) $('mk').onclick = async () => {
        const { data, error } = await sb.from('clients').insert({ name: c.display_name || c.username || 'Клієнт', telegram: c.username ? '@' + c.username : null, source: 'telegram' }).select().single();
        if (error) return $('msg').textContent = 'Помилка: ' + error.message; await sb.from('conversations').update({ client_id: data.id }).eq('id', c.id); closeModal(); openClient(data.id);
      };
      if ($('lk')) $('lk').onclick = () => {
        modal(`<h2 class="mb-3 text-xl font-bold">Прив'язати до клієнта</h2><div class="grid gap-3"><input id="cs" type="search" placeholder="Ім'я або телефон" class="${INP}"><select id="cl" size="5" class="${INP}"></select><button id="go" class="${BTN}">Прив'язати</button></div>`);
        const fill = async () => { const s = $('cs').value.trim().replace(/[,()%]/g, ' '); let r = sb.from('clients').select('id,name,phone').order('created_at', { ascending: false }).limit(20); if (s) r = r.or(`name.ilike.%${s}%,phone.ilike.%${s}%`); const { data } = await r; $('cl').innerHTML = (data || []).map(x => `<option value="${x.id}">${esc(x.name)} ${esc(x.phone || '')}</option>`).join(''); };
        let t; $('cs').oninput = () => { clearTimeout(t); t = setTimeout(fill, 250); }; fill();
        $('go').onclick = async () => { if (!$('cl').value) return; await sb.from('conversations').update({ client_id: $('cl').value }).eq('id', c.id); closeModal(); openClient($('cl').value); };
      };
    }

    /* ===== Сьогодні ===== */
    const dayRange = d => { const a = new Date(d); a.setHours(0, 0, 0, 0); const b = new Date(a); b.setDate(b.getDate() + 1); return [a.toISOString(), b.toISOString()]; };
    const hm = d => new Date(d).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
    const iso = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
    const KIND = { inspection: 'Огляд', work: 'Робота' }, AS = { planned: 'Запланований', done: 'Був', cancelled: 'Скасований', no_show: 'Не прийшов' };
    const wait = l => { const m = Math.round((Date.now() - new Date(l.created_at)) / 60000); return m < 60 ? m + ' хв' : m < 1440 ? Math.floor(m / 60) + ' год' : Math.floor(m / 1440) + ' дн'; };
    async function viewToday() {
      $('view').innerHTML = `<h1 class="text-2xl font-extrabold">Сьогодні</h1><div id="tb" class="mt-4 space-y-6"><p class="text-mist/60">Завантаження…</p></div>`;
      const [a, b] = dayRange(new Date()), today = iso(new Date()), soon = iso(new Date(Date.now() + 7 * 864e5));
      const [nl, fu, ap, rm, st] = await Promise.all([
        sb.from('leads').select('*').eq('status', 'new').order('created_at'),
        sb.from('leads').select('*').in('status', ['in_progress', 'booked']).lte('next_contact_at', today).order('next_contact_at'),
        sb.from('appointments').select('*, clients(name,phone,telegram,viber), cars(model)').eq('status', 'planned').gte('starts_at', a).lt('starts_at', b).order('starts_at'),
        sb.from('order_items').select('id,name,remind_at,orders(client_id,clients(id,name,phone,telegram,viber,consent_marketing))').not('remind_at', 'is', null).lte('remind_at', soon).order('remind_at'), sb.from('v_stock').select('*').eq('active', true)]);
      if (nl.error || ap.error || rm.error) return $('tb').textContent = 'Помилка завантаження.';
      const sec = (t, n, body) => `<section><h2 class="mb-2 font-bold">${t} <span class="text-mist/60">${n}</span></h2><div class="space-y-2">${body || '<p class="text-sm text-mist/60">Немає</p>'}</div></section>`;
      const lead = (l, note) => `<button data-l="${l.id}" class="block w-full rounded-2xl bg-card p-4 text-left"><b>${esc(l.name)}</b> <span class="text-sm text-accent">${note}</span><div class="text-sm text-mist/80">${esc(l.contact)} · ${esc(l.service_interest || '')}</div></button>`;
      const all = [...nl.data, ...fu.data], low = (st.data || []).filter(m => +m.min_stock > 0 && m.balance <= +m.min_stock);
      $('tb').innerHTML =
        sec('Нові заявки', nl.data.length, nl.data.map(l => lead(l, 'чекає ' + wait(l))).join('')) +
        sec('Передзвонити', fu.data.length, fu.data.map(l => lead(l, 'контакт ' + l.next_contact_at)).join('')) +
        sec('Записи на сьогодні', ap.data.length, ap.data.map(x => `<button data-a="${x.id}" class="block w-full rounded-2xl bg-card p-4 text-left"><b>${hm(x.starts_at)}</b> · ${esc(x.clients && x.clients.name)} <span class="text-sm text-mist/70">${KIND[x.kind]}${x.cars ? ' · ' + esc(x.cars.model) : ''}</span></button>`).join('')) +
        sec('Кому нагадати (7 днів)', rm.data.length, rm.data.map(r => { const c = r.orders.clients; return `<div class="rounded-2xl bg-card p-4"><b>${esc(c.name)}</b> <span class="text-sm text-mist/70">· ${esc(r.name)} · до ${esc(r.remind_at)}</span>${c.consent_marketing ? '' : '<div class="text-xs text-accent">Немає згоди на пропозиції: краще подзвонити</div>'}<div class="mt-2 flex flex-wrap gap-2">${links(c, '')}<button data-done="${r.id}" data-c="${c.id}" data-n="${esc(r.name)}" class="${BTN2} text-sm">Зроблено</button></div></div>`; }).join('')) +
        (low.length ? sec('Матеріали закінчуються', low.length, low.map(m => `<button data-sk class="flex w-full justify-between rounded-2xl bg-card p-4 text-left"><b>${esc(m.name)}</b><span class="text-accent">${+(+m.balance).toFixed(2)} ${esc(m.unit)}</span></button>`).join('')) : '');
      document.querySelectorAll('[data-sk]').forEach(b => b.onclick = () => { tab = 'stock'; render(); });
      document.querySelectorAll('[data-l]').forEach(b => b.onclick = () => openLead(all.find(x => x.id === b.dataset.l)));
      document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => openAppt(ap.data.find(x => x.id === b.dataset.a)));
      document.querySelectorAll('[data-done]').forEach(b => b.onclick = async () => {
        await sb.from('order_items').update({ remind_at: null }).eq('id', b.dataset.done);
        await sb.from('timeline').insert({ client_id: b.dataset.c, kind: 'note', text: 'Нагадування про повторний візит: ' + b.dataset.n, created_by: me.id }); viewToday();
      });
    }

    /* ===== Календар ===== */
    let cdate = new Date();
    async function viewCal() {
      $('view').innerHTML = `<div class="flex items-center justify-between"><h1 class="text-2xl font-extrabold">Календар</h1><button id="na" class="${BTN} px-4 py-2 text-sm">+ Запис</button></div>
  <div class="my-4 flex gap-2"><button id="pv" class="${BTN2} px-4" aria-label="Попередній день">&lsaquo;</button><input id="dt" type="date" value="${iso(cdate)}" class="${INP}"><button id="nx" class="${BTN2} px-4" aria-label="Наступний день">&rsaquo;</button></div><div id="list" class="space-y-2"></div>`;
      const go = d => { cdate = d; viewCal(); };
      $('pv').onclick = () => go(new Date(cdate.getTime() - 864e5)); $('nx').onclick = () => go(new Date(cdate.getTime() + 864e5));
      $('dt').onchange = e => e.target.value && go(new Date(e.target.value + 'T12:00')); $('na').onclick = () => newAppt();
      const [a, b] = dayRange(cdate); const { data, error } = await sb.from('appointments').select('*, clients(name,phone,telegram,viber), cars(model)').gte('starts_at', a).lt('starts_at', b).order('starts_at');
      if (error) return $('list').textContent = 'Помилка: ' + error.message;
      $('list').innerHTML = data.length ? data.map(x => `<button data-a="${x.id}" class="block w-full rounded-2xl bg-card p-4 text-left ${x.status === 'planned' ? '' : 'opacity-60'}"><b>${hm(x.starts_at)}${x.duration_min ? ' · ' + x.duration_min + ' хв' : ''}</b> · ${esc(x.clients && x.clients.name)}<div class="text-sm text-mist/70">${KIND[x.kind]}${x.cars ? ' · ' + esc(x.cars.model) : ''} · ${AS[x.status]}</div></button>`).join('') : '<p class="text-mist/60">На цей день записів немає.</p>';
      document.querySelectorAll('[data-a]').forEach(btn => btn.onclick = () => openAppt(data.find(x => x.id === btn.dataset.a)));
    }
    function openAppt(x) {
      modal(`<div class="flex justify-between"><div><h2 class="text-xl font-bold">${esc(x.clients && x.clients.name)}</h2><p class="text-sm text-mist/70">${KIND[x.kind]} · ${fmt(x.starts_at)}${x.cars ? ' · ' + esc(x.cars.model) : ''} · ${AS[x.status]}</p></div><button id="x" class="text-2xl leading-none text-mist/60" aria-label="Закрити">&times;</button></div>
  <div class="mt-3 flex flex-wrap gap-2">${links(x.clients || {}, '')}</div>${x.notes ? `<p class="mt-3 text-sm">${esc(x.notes)}</p>` : ''}
  <div class="mt-4 grid gap-2">${['done', 'cancelled', 'no_show'].map(k => `<button data-s="${k}" class="${BTN2}">${AS[k]}</button>`).join('')}<button id="mo" class="${BTN}">Створити замовлення</button></div>`);
      $('x').onclick = closeModal; $('mo').onclick = () => { closeModal(); newOrder(x.client_id); };
      document.querySelectorAll('[data-s]').forEach(b => b.onclick = async () => {
        await sb.from('appointments').update({ status: b.dataset.s }).eq('id', x.id);
        await sb.from('timeline').insert({ client_id: x.client_id, kind: 'visit', text: `${KIND[x.kind]} ${fmt(x.starts_at)}: ${AS[b.dataset.s]}`, created_by: me.id }); closeModal(); render();
      });
    }
    function newAppt() {
      const d0 = new Date(cdate); d0.setHours(10, 0, 0, 0); const loc = new Date(d0 - d0.getTimezoneOffset() * 6e4).toISOString().slice(0, 16);
      modal(`<h2 class="mb-3 text-xl font-bold">Новий запис</h2><div class="grid gap-3"><input id="cs" type="search" placeholder="Пошук клієнта: ім'я або телефон" class="${INP}"><select id="cl" size="4" class="${INP}"></select><select id="ca" class="${INP}"><option value="">Авто</option></select>
  <select id="kd" class="${INP}"><option value="inspection">Огляд</option><option value="work">Робота</option></select><input id="st" type="datetime-local" value="${loc}" class="${INP}"><input id="du" type="number" min="5" step="5" placeholder="Тривалість, хв" class="${INP}">
  <select id="as" class="${INP}"><option value="">Хто веде</option>${staff.map(s => `<option value="${s.user_id}">${esc(s.name)}</option>`).join('')}</select><textarea id="nt" rows="2" placeholder="Нотатки" class="${INP}"></textarea><button id="go" class="${BTN}">Створити</button><p id="msg" class="text-sm"></p></div>`);
      const pick = async () => { const { data } = await sb.from('cars').select('*').eq('client_id', $('cl').value); $('ca').innerHTML = '<option value="">Авто</option>' + (data || []).map(a => `<option value="${a.id}">${esc([a.model, a.plate].filter(Boolean).join(' · '))}</option>`).join(''); };
      const fill = async () => { const s = $('cs').value.trim().replace(/[,()%]/g, ' '); let r = sb.from('clients').select('id,name,phone').order('created_at', { ascending: false }).limit(20); if (s) r = r.or(`name.ilike.%${s}%,phone.ilike.%${s}%`); const { data } = await r; $('cl').innerHTML = (data || []).map(c => `<option value="${c.id}">${esc(c.name)} ${esc(c.phone || '')}</option>`).join(''); };
      let t; $('cs').oninput = () => { clearTimeout(t); t = setTimeout(fill, 250); }; $('cl').onchange = pick; fill();
      $('go').onclick = async () => {
        if (!$('cl').value || !$('st').value) return $('msg').textContent = 'Оберіть клієнта й час.';
        const { error } = await sb.from('appointments').insert({ client_id: $('cl').value, car_id: $('ca').value || null, kind: $('kd').value, starts_at: new Date($('st').value).toISOString(), duration_min: +$('du').value || null, assignee: $('as').value || null, notes: $('nt').value || null });
        if (error) return $('msg').textContent = 'Помилка: ' + error.message;
        await sb.from('timeline').insert({ client_id: $('cl').value, kind: 'visit', text: `Запис: ${KIND[$('kd').value]} ${fmt(new Date($('st').value))}`, created_by: me.id }); closeModal(); render();
      };
    }

    if (!SUPABASE_URL) app.innerHTML = '<p class="p-6">Вкажіть SUPABASE_URL і SUPABASE_ANON_KEY на початку скрипта в crm/index.html.</p>'; else start();
  </script>
</body>

</html>
